; PlatformIO — ESP32-C3 SuperMini (compatible con esp32-c3-devkitm-1)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-supermini

; Valores comunes para todas las configs de esta placa
[env:common]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
; Evita reset al abrir el monitor (importante con USB CDC nativo)
monitor_rts = 0
monitor_dtr = 0
monitor_filters = time, esp32_exception_decoder
upload_speed = 460800
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

[env:esp32-c3-supermini]
extends = env:common
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 160000000L
board_upload.flash_size = 4MB
; Descomentá y cambiá el puerto si PlatformIO no lo detecta solo:
; upload_port = COM3
; monitor_port = COM3
